name: CI

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: nexterm-windows
          path: |
            release/*.exe
          retention-days: 14

  windows-real:
    name: Real Windows diagnostics
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run diagnostics and commands on Windows
        run: npm run test:windows
      - name: UI smoke test (screenshots of every page)
        if: always()
        run: |
          npm run build
          npx electron tests/e2e/shots.cjs screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-audit
          path: |
            audit-output/
            screenshots/
          retention-days: 14
